# Ambiente de desenvolvimento. Inicie com: docker compose up --build
name: sgca

services:
  postgres:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV_DEPENDENCIES: "true"
    env_file: .env
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    # `:z` é necessário em hosts com SELinux (ex.: Fedora) para montar o código.
    volumes:
      - ./backend:/app:z
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    # Somente o necessário: o frontend não recebe segredos do backend.
    environment:
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://backend:8000}
    volumes:
      - ./frontend:/app:z
      # Mantém as dependências instaladas na imagem, sem sobrescrever pelo host.
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
